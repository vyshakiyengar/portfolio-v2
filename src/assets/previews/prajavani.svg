<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="pvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="blueLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="420" fill="url(#pvBg)" />

  <!-- Outer Editorial Frame -->
  <rect x="24" y="24" width="752" height="372" rx="6" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <rect x="28" y="28" width="744" height="364" rx="4" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />

  <!-- Top Masthead Plaque -->
  <g transform="translate(48, 52)">
    <!-- Prajavani Red Seal -->
    <rect x="0" y="0" width="32" height="32" rx="4" fill="#C8102E" />
    <text x="7" y="23" font-family="'Noto Sans Kannada', 'Segoe UI', serif" font-size="20" font-weight="900" fill="#FFFFFF">ಪ್ರ</text>
    
    <!-- Masthead Wordmark -->
    <text x="44" y="22" font-family="'Noto Sans Kannada', 'Cormorant Garamond', serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">ಪ್ರಜಾವಾಣಿ</text>
    <text x="146" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" letter-spacing="1.5">PRAJAVANI</text>
    <text x="244" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">· ESTD. 1948 · LEADING KANNADA DAILY</text>

    <!-- Date & Section Pill -->
    <g transform="translate(560, 4)">
      <rect width="144" height="24" rx="12" fill="rgba(200, 16, 46, 0.15)" stroke="rgba(200, 16, 46, 0.5)" stroke-width="1" />
      <text x="72" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#FCA5A5" letter-spacing="0.8">25 AUGUST 2026</text>
    </g>
  </g>

  <!-- Fine Editorial Divider -->
  <line x1="48" y1="104" x2="752" y2="104" stroke="url(#blueLine)" stroke-width="1.5" />

  <!-- Section Topic Kicker -->
  <g transform="translate(48, 134)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.8">TECHNOLOGY SPECIAL  ·  AI INNOVATION &amp; COMMERCE</text>
  </g>

  <!-- Primary Kannada Headline -->
  <g transform="translate(48, 178)">
    <text font-family="'Noto Sans Kannada', 'Cormorant Garamond', Georgia, serif" font-size="25" font-weight="700" fill="#FFFFFF" letter-spacing="-0.2">
      <tspan x="0" dy="0">ಸ್ಟಾರ್ಟ್‌ ಅಪ್‌: ತಾಯಿಗಾಗಿ AI ಶಾಪಿಂಗ್ ಏಜೆಂಟ್</tspan>
      <tspan x="0" dy="36">ಪರಿಚಯಿಸಿದ ಬೆಂಗಳೂರಿನ ಟೆಕಿ</tspan>
    </text>
  </g>

  <!-- Editorial Sub-headline & Summary -->
  <g transform="translate(48, 276)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#94A3B8" line-height="1.6">
      <tspan x="0" dy="0">Bengaluru engineer Vyshak Iyengar develops a conversational WhatsApp AI shopping agent,</tspan>
      <tspan x="0" dy="22">enabling vernacular voice and text grocery ordering through Swiggy MCP integration.</tspan>
    </text>
  </g>

  <!-- Bottom Metadata Badges -->
  <g transform="translate(48, 344)">
    <g transform="translate(0, 0)">
      <rect width="136" height="24" rx="4" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
      <text x="68" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">WHATSAPP AI AGENT</text>
    </g>
    <g transform="translate(146, 0)">
      <rect width="144" height="24" rx="4" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
      <text x="72" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">SWIGGY MCP TOOLS</text>
    </g>
    <g transform="translate(300, 0)">
      <rect width="138" height="24" rx="4" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
      <text x="69" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">KANNADA VOICE AI</text>
    </g>

    <!-- Byline on the right -->
    <text x="704" y="16" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">Report by E.S. Sudheendra Prasad</text>
  </g>
</svg>
