<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="pvBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0A0C" />
      <stop offset="50%" stop-color="#12080A" />
      <stop offset="100%" stop-color="#1E1316" />
    </linearGradient>
    <linearGradient id="pvRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8102E" />
      <stop offset="100%" stop-color="#E52D27" />
    </linearGradient>
    <linearGradient id="goldPillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="waGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#128C7E" />
    </linearGradient>
    <linearGradient id="swiggyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FC8019" />
      <stop offset="100%" stop-color="#E23744" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#pvBgGrad)" />

  <!-- Subtle Newspaper Print Grid / Accents -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="70" x2="800" y2="70" />
    <line x1="0" y1="140" x2="800" y2="140" />
    <line x1="0" y1="210" x2="800" y2="210" />
    <line x1="0" y1="280" x2="800" y2="280" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="160" y1="0" x2="160" y2="420" />
    <line x1="320" y1="0" x2="320" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="640" y1="0" x2="640" y2="420" />
  </g>

  <!-- Top Masthead Bar: Prajavani Newspaper Header -->
  <rect x="0" y="0" width="800" height="54" fill="#8F101A" />
  <g transform="translate(40, 16)">
    <!-- Prajavani Icon & Wordmark -->
    <rect x="0" y="0" width="22" height="22" rx="4" fill="#FFD700" />
    <text x="5" y="16" font-family="'Noto Sans Kannada', -apple-system, sans-serif" font-size="14" font-weight="900" fill="#8F101A">ಪ್ರ</text>
    <text x="32" y="16" font-family="'Noto Sans Kannada', 'Roboto Slab', serif" font-size="17" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">ಪ್ರಜಾವಾಣಿ</text>
    <text x="116" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFAAA6" letter-spacing="1.5">| PRAJAVANI</text>
    <text x="215" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#FFD700">· MOST POPULAR KANNADA DAILY</text>
  </g>
  <g transform="translate(630, 18)">
    <rect x="0" y="0" width="130" height="20" rx="10" fill="rgba(255, 215, 0, 0.2)" stroke="#FFD700" stroke-width="1" />
    <text x="65" y="13.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#FFD700" letter-spacing="1">TECH SPECIAL</text>
  </g>

  <!-- Breadcrumbs & Category -->
  <g transform="translate(40, 84)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FF6B6B" letter-spacing="1.5">STARTUP &amp; GADGET NEWS  /  AI INNOVATION  /  WHATSAPP MCP</text>
  </g>

  <!-- Article Headlines: Kannada & English -->
  <g transform="translate(40, 120)">
    <text font-family="'Noto Sans Kannada', 'Cormorant Garamond', Georgia, serif" font-size="25" font-weight="700" fill="#FFFFFF" letter-spacing="-0.2">
      <tspan x="0" dy="0">ತಾಯಿಗಾಗಿ AI ಶಾಪಿಂಗ್ ಏಜೆಂಟ್ ಪರಿಚಯಿಸಿದ ಬೆಂಗಳೂರಿನ ಟೆಕಿ</tspan>
    </text>
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#CBD5E1" letter-spacing="0.2">
      <tspan x="0" dy="34">Bengaluru Techie Builds WhatsApp AI Shopping Agent for Voice &amp; Text Grocery Ordering</tspan>
    </text>
  </g>

  <!-- Key Badges Container -->
  <g transform="translate(40, 206)">
    <!-- WhatsApp Agent Pill -->
    <g transform="translate(0, 0)">
      <rect width="170" height="34" rx="6" fill="rgba(37, 211, 102, 0.15)" stroke="rgba(37, 211, 102, 0.5)" stroke-width="1" />
      <circle cx="18" cy="17" r="6" fill="#25D366" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4ADE80">WhatsApp AI Agent</text>
    </g>

    <!-- Swiggy MCP Pill -->
    <g transform="translate(182, 0)">
      <rect width="170" height="34" rx="6" fill="rgba(252, 128, 25, 0.15)" stroke="rgba(252, 128, 25, 0.5)" stroke-width="1" />
      <circle cx="18" cy="17" r="6" fill="#FC8019" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FB923C">Swiggy MCP Tools</text>
    </g>

    <!-- Kannada Voice & Multimodal Pill -->
    <g transform="translate(364, 0)">
      <rect width="180" height="34" rx="6" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1" />
      <circle cx="18" cy="17" r="6" fill="#F59E0B" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FBBF24">ಕನ್ನಡ Voice &amp; Speech</text>
    </g>

    <!-- Prajavani Daily Pill -->
    <g transform="translate(556, 0)">
      <rect width="164" height="34" rx="6" fill="rgba(200, 16, 46, 0.2)" stroke="rgba(200, 16, 46, 0.6)" stroke-width="1" />
      <circle cx="18" cy="17" r="6" fill="#E52D27" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FCA5A5">ಪ್ರಜಾವಾಣಿ Featured</text>
    </g>
  </g>

  <!-- Interactive Story Card Graphic -->
  <g transform="translate(40, 260)">
    <rect width="720" height="128" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    
    <!-- WhatsApp Message Graphic Simulation -->
    <g transform="translate(24, 24)">
      <!-- User / Mother Voice Bubble -->
      <g transform="translate(0, 0)">
        <rect width="320" height="36" rx="8" fill="#1F2C34" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <circle cx="18" cy="18" r="10" fill="#25D366" />
        <polygon points="15,13 23,18 15,23" fill="#FFFFFF" />
        <!-- Waveform lines -->
        <line x1="38" y1="18" x2="200" y2="18" stroke="#8696A0" stroke-width="3" stroke-linecap="round" stroke-dasharray="2,4" />
        <text x="215" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#8696A0">0:14 🎤</text>
        <text x="260" y="22" font-family="-apple-system, sans-serif" font-size="10" fill="#00A884">✓✓</text>
      </g>

      <!-- AI Agent Response Bubble -->
      <g transform="translate(0, 44)">
        <rect width="380" height="42" rx="8" fill="#005C4B" />
        <text x="14" y="19" font-family="'Noto Sans Kannada', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#E9EDEF">"ಹಾಲು, ಬ್ರೆಡ್ ಮತ್ತು ಹಣ್ಣುಗಳನ್ನು Swiggy ಕಾರ್ಟ್‌ಗೆ ಸೇರಿಸಲಾಗಿದೆ!"</text>
        <text x="14" y="34" font-family="-apple-system, sans-serif" font-size="10" fill="#8696A0">Swiggy Instamart Cart &amp; Checkout Ready · Vyshak Iyengar</text>
      </g>
    </g>

    <!-- Side Highlight Info -->
    <g transform="translate(435, 30)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFD700">Prajavani Technology Feature</text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#E2E8F0" y="24">Vyshak Iyengar's AI Agent</text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94A3B8" y="44">Making digital commerce accessible</text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94A3B8" y="62">via vernacular voice &amp; Meta WhatsApp</text>
    </g>
  </g>
</svg>
