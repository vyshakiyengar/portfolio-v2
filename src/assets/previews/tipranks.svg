<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="trBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="tealLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#00D2B4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="420" fill="url(#trBg)" />

  <!-- Outer Editorial Frame -->
  <rect x="24" y="24" width="752" height="372" rx="6" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <rect x="28" y="28" width="744" height="364" rx="4" fill="none" stroke="rgba(14, 165, 233, 0.2)" stroke-width="1" />

  <!-- Top Masthead Plaque -->
  <g transform="translate(48, 52)">
    <!-- TipRanks Logo Mark -->
    <rect x="0" y="0" width="30" height="30" rx="4" fill="#00D2B4" />
    <path d="M7 15 L12 20 L23 10" fill="none" stroke="#0B0F19" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Masthead Wordmark -->
    <text x="42" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">TipRanks</text>
    <text x="135" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748B">™</text>
    <text x="156" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1.5">| FINANCIAL &amp; MARKET TECHNOLOGY</text>

    <!-- Date & Section Pill -->
    <g transform="translate(560, 4)">
      <rect width="144" height="24" rx="12" fill="rgba(0, 210, 180, 0.12)" stroke="rgba(0, 210, 180, 0.4)" stroke-width="1" />
      <text x="72" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#00D2B4" letter-spacing="0.8">18 AUGUST 2026</text>
    </g>
  </g>

  <!-- Fine Editorial Divider -->
  <line x1="48" y1="104" x2="752" y2="104" stroke="url(#tealLine)" stroke-width="1.5" />

  <!-- Section Topic Kicker -->
  <g transform="translate(48, 134)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00D2B4" letter-spacing="1.8">PRIVATE COMPANIES  ·  SPEECH AI  ·  SWIGGY ECOSYSTEM</text>
  </g>

  <!-- Primary Headline -->
  <g transform="translate(48, 178)">
    <text font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="30" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3">
      <tspan x="0" dy="0">Voice-Based Kannada AI Ordering Agent</tspan>
      <tspan x="0" dy="38">Showcases Conversational Commerce in Swiggy</tspan>
    </text>
  </g>

  <!-- Editorial Summary -->
  <g transform="translate(48, 276)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#94A3B8" line-height="1.6">
      <tspan x="0" dy="0">Architected by Vyshak Iyengar: pioneering vernacular voice ordering on Meta WhatsApp</tspan>
      <tspan x="0" dy="22">interfaced seamlessly with food discovery and Swiggy checkout via Model Context Protocol.</tspan>
    </text>
  </g>

  <!-- Bottom Metadata Badges -->
  <g transform="translate(48, 344)">
    <g transform="translate(0, 0)">
      <rect width="138" height="24" rx="4" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="69" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">SWIGGY MCP AGENT</text>
    </g>
    <g transform="translate(148, 0)">
      <rect width="144" height="24" rx="4" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="72" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">SPEECH INTELLIGENCE</text>
    </g>
    <g transform="translate(302, 0)">
      <rect width="132" height="24" rx="4" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="66" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">ಕನ್ನಡ VOICE AI</text>
    </g>

    <!-- Attribution on the right -->
    <text x="704" y="16" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">TipRanks Market Tech Desk</text>
  </g>
</svg>
